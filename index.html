<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="orizonCP" />
    <meta name="apple-mobile-web-app-title" content="orizonCP" />
    <link rel="icon" type="image/svg+xml" href="/favicon-monochrome.svg" />
    <title>orizonCP</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      .page-loader-wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
      }
      .page-loader {
        --dim: 3rem;
        width: var(--dim);
        height: var(--dim);
        position: relative;
        animation: page-loader-spin 2s linear infinite;
      }
      .page-loader .circle {
        --color: #737373;
        --dim: 1.2rem;
        width: var(--dim);
        height: var(--dim);
        background-color: var(--color);
        border-radius: 50%;
        position: absolute;
      }
      .page-loader .circle:nth-child(1) {
        top: 0;
        left: 0;
      }
      .page-loader .circle:nth-child(2) {
        top: 0;
        right: 0;
      }
      .page-loader .circle:nth-child(3) {
        bottom: 0;
        left: 0;
      }
      .page-loader .circle:nth-child(4) {
        bottom: 0;
        right: 0;
      }
      @keyframes page-loader-spin {
        0% {
          transform: scale(1) rotate(0);
        }
        20%,
        25% {
          transform: scale(1.3) rotate(90deg);
        }
        45%,
        50% {
          transform: scale(1) rotate(180deg);
        }
        70%,
        75% {
          transform: scale(1.3) rotate(270deg);
        }
        95%,
        100% {
          transform: scale(1) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="page-loader-wrap">
        <div class="page-loader">
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
          <div class="circle"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
